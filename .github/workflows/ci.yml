name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow pytest
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the tools
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "tools")
          import numpy as np, xpro_core as xc
          img = np.random.default_rng(0).random((48, 48, 3)).astype("float32")
          xc.save_image("/tmp/smoke.png", img)
          PY
          python tools/xpro_lut_applier.py /tmp/smoke.png /tmp/smoke_out.png --preset c41_in_e6
          python tools/make_gallery.py
